<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">WiWave live monitor illustrative preview</title><desc id="desc">Dark monitoring dashboard illustration with a Wi-Fi RSSI time series and a clear notice that RSSI changes do not identify people.</desc>
